# T036 + T107: lint, tests, build y accesibilidad en cada PR a dev/main.
name: ci

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt -r backend/etl/requirements.txt
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Datos (mock en CI: el GTFS real vive en un Release y pesa 112 MB)
        run: |
          pip install -r backend/requirements.txt -r backend/etl/requirements.txt
          python -m backend.etl.build --mock --offline frontend/public/offline
      - working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Lighthouse CI (accesibilidad ≥ 90)
        working-directory: frontend
        run: npx --yes @lhci/cli@0.14.x autorun
