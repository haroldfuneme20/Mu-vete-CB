# Mapeo de archivos crudos REALES → ETL (P-03 / P-04), revisado el 2026-09-24.
# Para los datos simulados se usa sources.mock.yaml (automático con --mock).
#
# Decisiones de la revisión de datos (constitución v2.3.0):
# - Las capas GeoJSON vienen recortadas a Ciudad Bolívar y vecinos; el GTFS es de toda Bogotá.
# - CableAereo_CB.geojson (cables proyectados del POT) se EXCLUYE: no son servicios operativos.
# - RutasProvisional_lnformales.geojson son rutas PROVISIONALES oficiales (RSPTRUTA=PROVISIONAL),
#   no informales: fuente institucional, solo para el mapa (no están en el GTFS).
# - Rutas_SITP.geojson no se usa: los recorridos SITP ya vienen en el GTFS (shapes.txt).

localidad_ciudad_bolivar: "ciudad bolivar"   # valor normalizado (minúsculas, sin tildes)

barrios:                         # sectores catastrales
  file: Sector_CB.geojson
  id_field: SCACODIGO
  name_field: SCANOMBRE
  localidad_field: LocNombre
  source_name: Sectores catastrales (Ciudad Bolívar y vecinos)
  kind: territorial

stations:
  - file: EstacionesTrasmiCB.geojson
    id_field: num_est
    name_field: nom_est
    fixed_kind: tm_station
    merge_m: 80
    source_id: src_tm_stations
    source_name: Estaciones TransMilenio (troncal)
    kind: institutional
  - file: Estaciones_cable.geojson
    id_field: cod_nodo
    name_field: nom_est
    fixed_kind: transmicable
    merge_m: 80
    source_id: src_cable_stations
    source_name: Estaciones TransMiCable
    kind: institutional

sitp_stops:
  file: ParaderosSITP_CB.geojson
  id_field: cenefa
  name_field: nombre_par
  source_name: Paraderos zonales SITP
  kind: institutional

trunk_lines:
  file: TrazadoTroncal_CB.geojson
  id_field: id_trazado
  name_field: nom_traz
  source_name: Trazado troncal TransMilenio
  kind: institutional

provisional_routes:
  file: RutasProvisional_lnformales.geojson
  code_field: RSPCDEFINI       # ZP-xxx; no coinciden con el GTFS → solo visualización
  name_field: RSPDENOMIN
  source_name: Rutas provisionales SITP
  kind: institutional

road_network:
  file: MallaVial_CB.geojson
  id_field: MVICODIGO
  name_field: MVIETIQUET
  hierarchy_field: MVITIPO
  main_values: ["AK", "AC"]    # avenidas carrera y calle
  source_name: Malla vial integrada (Ciudad Bolívar)
  kind: institutional

gtfs:
  file: GTFS_20260818.zip
  source_name: GTFS TransMilenio S.A. (feed 2026-08-18)
  kind: institutional
  cable_route_types: [5, 6, 7]
  agency_modes:                # agency.txt del feed
    "1": troncal               # Transmilenio-Troncal
    "2": alimentador           # Transmilenio-Alimentadores
    "3": zonal                 # Zonal-Urbano
    "4": zonal                 # Zonal-Complementario
    "5": zonal                 # Zonal-Especial
    "6": troncal               # Transmilenio-Dual
    "7": transmicable          # TransMiCable
  service_day: monday          # patrones de un día hábil típico (calendar.txt)
  default_reliability: 0.85
  default_confidence: 0.95
  cable_reliability: 0.95
  default_service: ["04:30", "23:00"]
  max_trips_per_pattern: 50
